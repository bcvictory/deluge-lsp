name: Compiler CLI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compiler-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run compile
      - run: node --test scripts/test-for-each.cjs scripts/test-cli-output.cjs
